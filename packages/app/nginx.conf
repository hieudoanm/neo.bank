server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API requests are proxied to the gateway so the SPA can use same-origin
    # URLs in every environment (no CORS, no baked-in host).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    # SPA fallback: client-side routes (/transfer, /transactions, ...) must
    # serve index.html so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
