version: '3.8'

services:
  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=neo_bank
    volumes:
      - cassandra_data:/var/lib/cassandra

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.9.10
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  api-gateway:
    build:
      context: ./packages/backend/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - accounts
      - transfer
      - transactions

  auth:
    build:
      context: ./packages/backend/auth
    ports:
      - "8081:8081"
    depends_on:
      - cassandra
      - kafka

  accounts:
    build:
      context: ./packages/backend/accounts
    ports:
      - "8082:8082"
    depends_on:
      - cassandra
      - kafka

  transfer:
    build:
      context: ./packages/backend/transfer
    ports:
      - "8083:8083"
    depends_on:
      - cassandra
      - kafka

  transactions:
    build:
      context: ./packages/backend/transactions
    ports:
      - "8084:8084"
    depends_on:
      - cassandra
      - kafka

  frontend:
    build:
      context: ./packages/frontend/app
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  cassandra_data:
