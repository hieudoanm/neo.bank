[project]
name = "graphdown"
version = "0.1.0"
description = "File graph extraction and visualization"
requires-python = "==3.15.2"
dependencies = [
    "typer==0.27.3",
    "pydantic==2.14.3",
    "markdown-it-py==4.2.0",
    "pyvis==0.3.2",
    "matplotlib==3.11.2",
    "networkx==3.7",
]

[project.scripts]
graphdown = "graphdown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.mypy.overrides]]
module = ["networkx", "pyvis.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
