<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#ffffff"/>

  <g>
    <rect x="230" y="20" width="260" height="56" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="360" y="54" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">pending</text>

    <rect x="230" y="150" width="260" height="56" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="360" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">processing</text>

    <rect x="30" y="280" width="240" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="150" y="307" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">completed</text>

    <rect x="450" y="280" width="240" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="570" y="307" text-anchor="middle" font-size="15" font-weight="600" fill="#7f1d1d">failed</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="360" y1="78" x2="360" y2="144" marker-end="url(#arr)"/>
  </g>
  <text x="375" y="116" font-size="11" fill="#64748b">Kafka consumer picks up</text>
  <text x="375" y="130" font-size="11" fill="#64748b">transfer.initiated</text>

  <g stroke="#16a34a" stroke-width="2" fill="none">
    <path d="M 300 206 L 160 274" marker-end="url(#arrG)"/>
  </g>
  <text x="150" y="240" font-size="11" fill="#16a34a" text-anchor="middle">account.debited +</text>
  <text x="150" y="254" font-size="11" fill="#16a34a" text-anchor="middle">account.credited</text>

  <g stroke="#dc2626" stroke-width="2" fill="none">
    <path d="M 420 206 L 560 274" marker-end="url(#arrR)"/>
  </g>
  <text x="570" y="240" font-size="11" fill="#dc2626" text-anchor="middle">debit or credit fails;</text>
  <text x="570" y="254" font-size="11" fill="#dc2626" text-anchor="middle">compensation applied</text>
</svg>
