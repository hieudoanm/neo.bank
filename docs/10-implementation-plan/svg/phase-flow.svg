<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="260" viewBox="0 0 1060 260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1060" height="260" fill="#ffffff"/>

  <!-- Row 1: phases 0-5, left to right -->
  <g font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <g><rect x="10" y="40" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="85" y="62" dy="0">Phase 0</text><text x="85" y="80" dy="0" font-size="11" font-weight="400" fill="#475569">Foundation</text></g>
    <g><rect x="185" y="40" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="260" y="62">Phase 1</text><text x="260" y="80" font-size="11" font-weight="400" fill="#475569">Data model</text></g>
    <g><rect x="360" y="40" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="435" y="62">Phase 2</text><text x="435" y="80" font-size="11" font-weight="400" fill="#475569">Authentication</text></g>
    <g><rect x="535" y="40" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="610" y="62">Phase 3</text><text x="610" y="80" font-size="11" font-weight="400" fill="#475569">Balance inquiry</text></g>
    <g><rect x="710" y="40" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="785" y="62">Phase 4</text><text x="785" y="80" font-size="11" font-weight="400" fill="#475569">Transfer init.</text></g>
    <g><rect x="885" y="40" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="960" y="62">Phase 5</text><text x="960" y="80" font-size="11" font-weight="400" fill="#475569">Kafka consumer</text></g>
  </g>

  <!-- Row 2: phases 6-11, right to left (snake) -->
  <g font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <g><rect x="885" y="170" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="960" y="192">Phase 6</text><text x="960" y="210" font-size="11" font-weight="400" fill="#475569">Transfer status</text></g>
    <g><rect x="710" y="170" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="785" y="192">Phase 7</text><text x="785" y="210" font-size="11" font-weight="400" fill="#475569">Transaction history</text></g>
    <g><rect x="535" y="170" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="610" y="192">Phase 8</text><text x="610" y="210" font-size="11" font-weight="400" fill="#475569">Security &amp; idempotency</text></g>
    <g><rect x="360" y="170" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="435" y="192">Phase 9</text><text x="435" y="210" font-size="11" font-weight="400" fill="#475569">Health &amp; observability</text></g>
    <g><rect x="185" y="170" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="260" y="192">Phase 10</text><text x="260" y="210" font-size="11" font-weight="400" fill="#475569">Docs &amp; demo</text></g>
    <g><rect x="10" y="170" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="85" y="192">Phase 11</text><text x="85" y="210" font-size="11" font-weight="400" fill="#475569">Cloud infra (opt.)</text></g>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="162" y1="67" x2="179" y2="67" marker-end="url(#arr)"/>
    <line x1="337" y1="67" x2="354" y2="67" marker-end="url(#arr)"/>
    <line x1="512" y1="67" x2="529" y2="67" marker-end="url(#arr)"/>
    <line x1="687" y1="67" x2="704" y2="67" marker-end="url(#arr)"/>
    <line x1="862" y1="67" x2="879" y2="67" marker-end="url(#arr)"/>
    <!-- snake connector: bottom of phase 5 down to top of phase 6 -->
    <path d="M 960 96 L 960 140 L 960 164" marker-end="url(#arrD)"/>
    <!-- row 2 arrows right to left -->
    <line x1="880" y1="197" x2="866" y2="197" marker-end="url(#arr)"/>
    <line x1="705" y1="197" x2="691" y2="197" marker-end="url(#arr)"/>
    <line x1="530" y1="197" x2="516" y2="197" marker-end="url(#arr)"/>
    <line x1="355" y1="197" x2="341" y2="197" marker-end="url(#arr)"/>
    <line x1="180" y1="197" x2="166" y2="197" marker-end="url(#arr)"/>
  </g>
</svg>
