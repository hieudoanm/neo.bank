name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth, accounts, transfer, transactions]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
      - name: Verify formatting
        run: |
          cd packages/backend/${{ matrix.service }}
          test -z "$(gofmt -l .)"
      - name: Vet, build, and test with coverage
        run: |
          cd packages/backend/${{ matrix.service }}
          go vet ./...
          go build ./...
          cd "$GITHUB_WORKSPACE"
          bash scripts/coverage/backend.sh packages/backend/${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Build and test
        run: |
          cd packages/frontend/app
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build

  pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Detect landing page changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "${{ github.event.before }}"
          if git diff --name-only "${{ github.event.before }}" HEAD | grep -q '^packages/frontend/landing/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          path: packages/frontend/landing
      - id: deployment
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
