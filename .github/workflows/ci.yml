name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth, accounts, transfer, transactions]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"
      - name: Build and test
        run: |
          cd packages/backend/${{ matrix.service }}
          go build ./...
          go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
      - name: Build and test
        run: |
          cd packages/frontend/app
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
