name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth, accounts, transfer, transactions]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
      - name: Verify formatting
        run: |
          cd packages/backend/${{ matrix.service }}
          test -z "$(gofmt -l .)"
      - name: Vet, build, and test with coverage
        run: |
          cd packages/backend/${{ matrix.service }}
          go vet ./...
          go build ./...
          cd "$GITHUB_WORKSPACE"
          bash scripts/coverage/backend.sh packages/backend/${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Build and test
        run: |
          cd packages/frontend/app
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build
