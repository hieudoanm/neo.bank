name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth, accounts, transfer, transactions]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
      - name: Verify formatting
        run: |
          cd packages/backend/${{ matrix.service }}
          test -z "$(gofmt -l .)"
      - name: Vet, build, and test with coverage
        run: |
          cd packages/backend/${{ matrix.service }}
          go vet ./...
          go build ./...
          cd "$GITHUB_WORKSPACE"
          bash scripts/coverage/backend.sh packages/backend/${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Build and test
        run: |
          cd packages/frontend/app
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  security-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Scan dependencies and IaC with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy filesystem results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  security-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            context: packages/backend/api-gateway
          - name: auth
            context: packages/backend/auth
          - name: accounts
            context: packages/backend/accounts
          - name: transfer
            context: packages/backend/transfer
          - name: transactions
            context: packages/backend/transactions
          - name: frontend
            context: packages/frontend/app
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build ${{ matrix.name }} image
        run: |
          docker build \
            -t neo-bank-ci/${{ matrix.name }}:latest \
            -f ${{ matrix.context }}/Dockerfile \
            ${{ matrix.context }}
      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: neo-bank-ci/${{ matrix.name }}:latest
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy ${{ matrix.name }} results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}
